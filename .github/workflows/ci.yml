name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rust and isolated network checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: 'true'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            hostapd wpasupplicant iw iproute2 nftables iputils-ping \
            wireguard-tools busybox python3 util-linux coreutils
          sudo ln -s "$(command -v busybox)" /usr/local/bin/udhcpc
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: cargo test --locked --workspace
      - name: Run isolated network and VPN tests
        run: sh packaging/test-namespaces.sh --sudo
      - name: Check packaging
        run: sh packaging/smoke-test.sh
