name: Compile Binaries

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      run_tests:
        description: 'Run tests before building'
        required: false
        default: false
        type: boolean
      tests_only:
        description: 'Run tests only without building/packaging binaries'
        required: false
        default: false
        type: boolean
      test_filter:
        description: 'Optional test filter pattern'
        required: false
        default: ''
        type: string
      cache:
        description: 'Enable Rust build cache'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  compile:
    name: Build Binaries (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          rustup show active-toolchain

      - name: Rust Cache
        if: ${{ inputs.cache != false && inputs.cache != 'false' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          save-if: "true"

      - name: Install test runtime dependencies
        if: ${{ inputs.run_tests == true || inputs.run_tests == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hostapd wpasupplicant iw

      - name: Run tests
        if: ${{ inputs.run_tests == true || inputs.run_tests == 'true' }}
        run: |
          # Always compile and run tests in fast debug mode (no release optimizations)
          if [ -n "${{ inputs.test_filter }}" ] && [ "${{ inputs.test_filter }}" != "all" ]; then
            echo "==> Running targeted tests (debug) matching: ${{ inputs.test_filter }}"
            cargo test -- ${{ inputs.test_filter }}
          elif [ "${{ inputs.test_filter }}" = "all" ]; then
            echo "==> Running complete test suite (debug)"
            cargo test
          else
            echo "==> Running library unit test suite (debug)"
            cargo test --lib
          fi

      - name: Build binaries
        if: ${{ inputs.tests_only != true && inputs.tests_only != 'true' }}
        run: |
          if [ "${{ inputs.profile }}" = "debug" ]; then
            cargo build --bins
            BUILD_DIR="target/debug"
          else
            cargo build --release --bins
            BUILD_DIR="target/release"
          fi

          mkdir -p release-binaries
          cp "$BUILD_DIR/traffic-masq" release-binaries/
          cp "$BUILD_DIR/traffic-masqd" release-binaries/
          strip release-binaries/traffic-masq release-binaries/traffic-masqd || true
          chmod +x release-binaries/traffic-masq release-binaries/traffic-masqd

          tar -czf release-binaries/traffic-masq-linux-x86_64.tar.gz -C release-binaries traffic-masq traffic-masqd

      - name: Upload compiled binaries
        if: ${{ inputs.tests_only != true && inputs.tests_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: traffic-masq-binaries
          path: release-binaries/*
          if-no-files-found: error
