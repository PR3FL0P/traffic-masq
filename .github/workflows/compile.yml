name: Compile Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        default: release
        type: choice
        options: [release, debug]
      run_tests:
        description: Run extra tests after mandatory validation
        default: false
        type: boolean
      tests_only:
        description: Run tests without building or packaging binaries
        default: false
        type: boolean
      test_filter:
        description: Optional extra test filter (implies run_tests)
        default: ''
        type: string
      cache:
        description: Enable Rust build caching, including mandatory validation
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-compile
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
  compile:
    needs: validate
    name: Build Binaries (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
          test-dependencies: ${{ inputs.run_tests || inputs.tests_only || inputs.test_filter != '' }}
      - name: Run extra tests
        if: inputs.run_tests || inputs.tests_only || inputs.test_filter != ''
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -n "$TEST_FILTER" ] && [ "$TEST_FILTER" != all ]; then
            cargo test --locked --workspace -- "$TEST_FILTER"
          elif [ "$TEST_FILTER" = all ]; then
            cargo test --locked --workspace
          else
            cargo test --locked --workspace --lib
          fi
      - name: Build and package binaries
        if: '!inputs.tests_only'
        env:
          BUILD_PROFILE: ${{ inputs.profile || 'release' }}
        run: |
          if [ "$BUILD_PROFILE" = debug ]; then
            cargo build --locked --workspace --bins
            build_dir=target/debug
          else
            cargo build --release --locked --workspace --bins
            build_dir=target/release
          fi
          BINARY_DIR="$build_dir" sh packaging/release.sh
          (cd release && sha256sum -c ./*.sha256)
          # Preserve direct binary downloads used by gitcompile.sh.
          cp "$build_dir/traffic-masq" "$build_dir/traffic-masqd" release/
      - name: Upload compiled binaries
        if: '!inputs.tests_only'
        uses: actions/upload-artifact@v7
        with:
          name: traffic-masq-binaries
          path: release/*
          if-no-files-found: error
