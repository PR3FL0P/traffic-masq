name: Compile Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      run_tests:
        description: 'Run extra tests after mandatory validation'
        required: false
        default: false
        type: boolean
      tests_only:
        description: 'Run tests only without building/packaging binaries'
        required: false
        default: false
        type: boolean
      test_filter:
        description: 'Optional test filter pattern'
        required: false
        default: ''
        type: string
      cache:
        description: 'Enable Rust build cache'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  compile:
    needs: validate
    name: Build Binaries (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: |
          rustup show active-toolchain

      - name: Rust Cache
        if: ${{ inputs.cache != false && inputs.cache != 'false' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          save-if: "true"

      - name: Install test runtime dependencies
        if: ${{ inputs.run_tests == true || inputs.run_tests == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hostapd wpasupplicant iw

      - name: Run tests
        if: ${{ inputs.run_tests == true || inputs.run_tests == 'true' }}
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          # Always compile and run tests in fast debug mode (no release optimizations)
          if [ -n "$TEST_FILTER" ] && [ "$TEST_FILTER" != "all" ]; then
            cargo test --locked --workspace -- "$TEST_FILTER"
          elif [ "$TEST_FILTER" = "all" ]; then
            echo "==> Running complete test suite (debug)"
            cargo test --locked --workspace
          else
            echo "==> Running library unit test suite (debug)"
            cargo test --locked --workspace --lib
          fi

      - name: Build binaries
        if: ${{ inputs.tests_only != true && inputs.tests_only != 'true' }}
        run: |
          if [ "${{ inputs.profile }}" = "debug" ]; then
            cargo build --locked --bins
            BUILD_DIR="target/debug"
          else
            cargo build --release --locked --bins
            BUILD_DIR="target/release"
          fi

          BINARY_DIR="$BUILD_DIR" sh packaging/release.sh
          (cd release && sha256sum -c ./*.sha256)
          # Preserve direct binary downloads used by gitcompile.sh.
          cp "$BUILD_DIR/traffic-masq" "$BUILD_DIR/traffic-masqd" release/

      - name: Upload compiled binaries
        if: ${{ inputs.tests_only != true && inputs.tests_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: traffic-masq-binaries
          path: release/*
          if-no-files-found: error
