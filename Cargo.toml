
[workspace]
members = ["crates/netlink", "crates/protocol", "crates/api-client", "crates/atomic-file", "crates/tui"]
default-members = [".", "crates/tui"]
resolver = "2"

[package]
name = "traffic-masq"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
rust-version = "1.95"
description = "Linux router, Wi-Fi and VPN management with confirmed network changes"
repository = "https://github.com/bpseditor/traffic-masq"

[lib]
name = "traffic_masq"
path = "src/lib.rs"

[[bin]]
name = "traffic-masqd"
path = "src/bin/traffic-masqd.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
genetlink = "0.2.7"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "service", "tokio"] }
ipnet = { version = "2", features = ["serde"] }
netlink-packet-core = "0.8"
netlink-packet-generic = "0.4"
netlink-packet-route = "0.19"
netlink-packet-wireguard = "0.4.2"
nix = { version = "0.29", features = ["fs", "net", "process", "signal", "socket", "uio", "user"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
rpassword = "7"
rtnetlink = "0.14"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
traffic-masq-api-client = { path = "crates/api-client" }
traffic-masq-atomic-file = { path = "crates/atomic-file" }
traffic-masq-netlink = { path = "crates/netlink" }
traffic-masq-protocol = { path = "crates/protocol" }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
traffic-masq-atomic-file = { path = "crates/atomic-file", features = ["fault-injection"] }
rcgen = "0.13"
tempfile = "3"
# Test-only tokio clock control (`start_paused`), so the DHCP client
# supervisor's restart backoff is asserted deterministically instead of by
# sleeping through it. Not a new dependency and not enabled for the library
# build: dev-dependency features apply to test targets only.
tokio = { version = "1", features = ["test-util"] }
