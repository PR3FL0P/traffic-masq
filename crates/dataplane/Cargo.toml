[package]
name = "traffic-masq-dataplane"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.95"
description = "IPv4 forwarding and nftables dataplane for traffic-masq"

[features]
test-support = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
traffic-masq-netlink = { path = "../netlink" }
traffic-masq-protocol = { path = "../protocol" }
