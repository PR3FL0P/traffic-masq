[package]
name = "traffic-masq-api-client"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.95"
description = "Unix-socket and verified HTTPS transports for the traffic-masq API"

[dependencies]
anyhow = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = "0.23.45"
rustls-pemfile = "2"
tokio-rustls = "0.26"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
traffic-masq-protocol = { path = "../protocol" }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
