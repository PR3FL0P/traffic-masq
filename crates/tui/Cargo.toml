[package]
name = "traffic-masq-tui"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.95"
description = "Terminal client for traffic-masq"
autobins = false

[[bin]]
name = "traffic-masq"
path = "src/bin/traffic-masq.rs"
doc = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
ipnet = { version = "2", features = ["serde"] }
nix = { version = "0.29", features = ["fs", "user"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_28", "layout-cache"] }
rpassword = "7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
zeroize = { version = "1", features = ["serde"] }
traffic-masq-api-client = { path = "../api-client" }
traffic-masq-atomic-file = { path = "../atomic-file" }
traffic-masq-netlink = { path = "../netlink" }
traffic-masq-host-observation = { path = "../host-observation" }
traffic-masq-protocol = { path = "../protocol" }

[dev-dependencies]
rcgen = "0.14.10"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "service", "tokio"] }
tempfile = "3"
