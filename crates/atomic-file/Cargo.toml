[package]
name = "traffic-masq-atomic-file"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
rust-version = "1.95"
description = "Crash-safe private file replacement for traffic-masq"

[features]
fault-injection = []

[dependencies]
anyhow = "1"
nix = { version = "0.29", features = ["fs"] }
thiserror = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
